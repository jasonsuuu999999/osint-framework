<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', accent: '#10b981' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <style>
        #cy { width: 100%; height: 480px; background-color: #0d1322; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-cyber-900 text-gray-200 min-h-screen font-mono">
    <div id="app" class="flex flex-col h-screen">

        <!-- 登入 Modal (未認證時鎖定畫面) -->
        <div v-if="!isAuthenticated" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-cyber-800 border border-gray-700 p-8 rounded-lg max-w-md w-full shadow-2xl space-y-6">
                <div class="text-center">
                    <div class="inline-block p-3 rounded-full bg-emerald-950 border border-emerald-800 text-2xl mb-2">🔒</div>
                    <h2 class="text-xl font-bold text-white tracking-wider">OSINT PLATFORM 授權存取</h2>
                    <p class="text-xs text-gray-400 mt-1">請輸入操作員認證金鑰登入系統</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">帳號 (Username)</label>
                        <input v-model="loginForm.username" type="text" placeholder="admin" class="w-full bg-cyber-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-accent">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">密碼 (Password)</label>
                        <input v-model="loginForm.password" @keyup.enter="handleLogin" type="password" placeholder="••••••••" class="w-full bg-cyber-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-accent">
                    </div>
                    <div v-if="loginError" class="text-xs text-red-400 bg-red-950/50 p-2 rounded border border-red-900">
                        {{ loginError }}
                    </div>
                    <button @click="handleLogin" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded transition">
                        驗證並進入系統
                    </button>
                    <p class="text-[11px] text-gray-500 text-center">預設管理員帳密：admin / admin123</p>
                </div>
            </div>
        </div>

        <!-- 頂部導航欄 -->
        <header class="bg-cyber-800 border-b border-gray-800 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-cyber-accent animate-ping"></div>
                <h1 class="text-lg font-bold text-white tracking-wider flex items-center gap-2">
                    <span>🛡️</span> OSINT INVESTIGATOR <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">v1.0</span>
                </h1>
            </div>
            <div class="flex items-center space-x-4 text-xs">
                <span class="text-gray-400">操作員: <strong class="text-emerald-400">{{ userProfile.username }}</strong> (<span class="text-blue-400">{{ userProfile.role }}</span>)</span>
                <button @click="handleLogout" class="text-red-400 hover:underline">登出</button>
            </div>
        </header>

        <!-- 主操作區 (與原先介面一致) -->
        <div class="flex-1 flex overflow-hidden">
            <!-- 左側操作面版 -->
            <aside class="w-96 bg-cyber-800 border-r border-gray-800 p-5 flex flex-col justify-between overflow-y-auto">
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">調查目標 (Target)</label>
                        <input v-model="targetInput" type="text" placeholder="輸入網域、人名、Email..." class="w-full bg-cyber-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-accent" :disabled="isLoading" @keyup.enter="startInvestigation"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">執行模式</label>
                        <div class="flex gap-4">
                            <label class="flex items-center text-sm cursor-pointer"><input type="radio" value="auto" v-model="mode" class="text-cyber-accent"><span class="ml-2 text-gray-300">⚡ 全自動</span></label>
                            <label class="flex items-center text-sm cursor-pointer"><input type="radio" value="custom" v-model="mode" class="text-cyber-accent"><span class="ml-2 text-gray-300">🛠️ 自選</span></label>
                        </div>
                    </div>
                    <div v-if="mode === 'custom'" class="bg-cyber-900 p-3 rounded border border-gray-800 space-y-2">
                        <label class="flex items-center text-xs text-gray-300"><input type="checkbox" value="maigret" v-model="selectedTools" class="mr-2"> Maigret (社群)</label>
                        <label class="flex items-center text-xs text-gray-300"><input type="checkbox" value="holehe" v-model="selectedTools" class="mr-2"> Holehe (信箱)</label>
                        <label class="flex items-center text-xs text-gray-300"><input type="checkbox" value="theHarvester" v-model="selectedTools" class="mr-2"> theHarvester (資產)</label>
                    </div>
                    <button @click="startInvestigation" :disabled="isLoading || !targetInput.trim()" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-700 text-white font-bold py-2.5 px-4 rounded transition">
                        <span v-if="!isLoading">🚀 開始情報調查</span>
                        <span v-else>探測中...</span>
                    </button>
                </div>
            </aside>

            <!-- 右側展示區 -->
            <main class="flex-1 flex flex-col overflow-y-auto p-6 space-y-6">
                <div class="bg-cyber-800 border border-gray-800 rounded-lg p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-gray-300">🌐 情報關聯圖譜</h2>
                        <button @click="resetGraphLayout" class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300">重整佈局</button>
                    </div>
                    <div id="cy"></div>
                </div>

                <div class="bg-cyber-800 border border-gray-800 rounded-lg flex-1 flex flex-col">
                    <div class="p-4 flex-1 overflow-y-auto">
                        <h3 class="text-xs font-bold text-gray-400 mb-2">🤖 AI 情報分析總結</h3>
                        <div class="text-sm text-gray-300 whitespace-pre-line bg-cyber-900 p-4 rounded border border-gray-800">
                            {{ currentCase.ai_summary || '尚未執行調查或尚未產生報告。' }}
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const isAuthenticated = ref(false);
                const token = ref(localStorage.getItem('osint_jwt') || '');
                const userProfile = ref({ username: '', role: '' });
                const loginForm = ref({ username: '', password: '' });
                const loginError = ref('');

                const targetInput = ref('');
                const mode = ref('auto');
                const selectedTools = ref(['maigret', 'holehe', 'theHarvester']);
                const isLoading = ref(false);
                const currentCase = ref({});
                let cy = null;

                const authHeaders = () => ({
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token.value}`
                });

                const handleLogin = async () => {
                    loginError.value = '';
                    try {
                        const formData = new URLSearchParams();
                        formData.append('username', loginForm.value.username);
                        formData.append('password', loginForm.value.password);

                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });

                        if (!res.ok) throw new Error('帳號或密碼錯誤');
                        const data = await res.json();
                        token.value = data.access_token;
                        localStorage.setItem('osint_jwt', data.access_token);
                        userProfile.value = { username: data.username, role: data.role };
                        isAuthenticated.value = true;
                    } catch (err) {
                        loginError.value = err.message;
                    }
                };

                const handleLogout = () => {
                    token.value = '';
                    localStorage.removeItem('osint_jwt');
                    isAuthenticated.value = false;
                };

                const checkAuth = async () => {
                    if (!token.value) return;
                    try {
                        const res = await fetch('/api/auth/me', { headers: authHeaders() });
                        if (res.ok) {
                            const data = await res.json();
                            userProfile.value = data;
                            isAuthenticated.value = true;
                        } else {
                            handleLogout();
                        }
                    } catch {
                        handleLogout();
                    }
                };

                const initGraph = () => {
                    cy = cytoscape({
                        container: document.getElementById('cy'),
                        elements: [],
                        style: [
                            { selector: 'node', style: { 'background-color': '#10b981', 'label': 'data(label)', 'color': '#fff', 'font-size': '10px' } },
                            { selector: 'node[type="TARGET"]', style: { 'background-color': '#ef4444', 'width': 35, 'height': 35, 'font-weight': 'bold' } },
                            { selector: 'edge', style: { 'width': 1.5, 'line-color': '#374151' } }
                        ],
                        layout: { name: 'cose' }
                    });
                };

                const updateGraphData = (target, entities) => {
                    if (!cy) return;
                    cy.elements().remove();
                    cy.add({ group: 'nodes', data: { id: 'target_root', label: `🎯 ${target}`, type: 'TARGET' } });
                    if (entities) {
                        entities.forEach((ent, idx) => {
                            const id = `node_${idx}`;
                            cy.add({ group: 'nodes', data: { id, label: ent.value } });
                            cy.add({ group: 'edges', data: { source: 'target_root', target: id } });
                        });
                    }
                    cy.layout({ name: 'cose', padding: 30 }).run();
                };

                const resetGraphLayout = () => { if (cy) cy.layout({ name: 'cose', padding: 30 }).run(); };

                const startInvestigation = async () => {
                    if (!targetInput.value.trim()) return;
                    isLoading.value = true;
                    try {
                        const res = await fetch('/api/investigate', {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify({ target: targetInput.value.trim(), tools: mode.value === 'custom' ? selectedTools.value : null })
                        });
                        const data = await res.json();
                        if (data.case_id) pollCaseStatus(data.case_id);
                    } catch {
                        isLoading.value = false;
                    }
                };

                const pollCaseStatus = (caseId) => {
                    const timer = setInterval(async () => {
                        try {
                            const res = await fetch(`/api/cases/${caseId}`, { headers: authHeaders() });
                            const data = await res.json();
                            currentCase.value = data;
                            if (data.status === 'COMPLETED' || data.status === 'FAILED') {
                                clearInterval(timer);
                                isLoading.value = false;
                                updateGraphData(data.target, data.entities);
                            }
                        } catch {
                            clearInterval(timer);
                            isLoading.value = false;
                        }
                    }, 2500);
                };

                onMounted(() => {
                    initGraph();
                    checkAuth();
                });

                return {
                    isAuthenticated, userProfile, loginForm, loginError, handleLogin, handleLogout,
                    targetInput, mode, selectedTools, isLoading, currentCase, startInvestigation, resetGraphLayout
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
